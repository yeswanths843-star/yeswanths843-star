name: Generate profile metrics

on:
  schedule:
    - cron: "0 */6 * * *"   # auto-refresh every 6 hours
  workflow_dispatch:         # manual "Run workflow" button in the Actions tab
  push:
    branches:
      - main

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

      # PANEL 1 — profile card: repos, stars, forks, watchers, lines added/removed
      - name: Core stats panel
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: yeswanths843-star
          filename: metrics.base.svg
          template: classic
          base: header, activity, community, repositories, metadata
          plugin_lines: yes
          config_timezone: Asia/Kolkata

      # PANEL 2 — contribution calendar heatmap
      - name: Calendar panel
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: yeswanths843-star
          filename: metrics.calendar.svg
          template: classic
          base: ""
          plugin_calendar: yes
          plugin_calendar_limit: 1
          config_timezone: Asia/Kolkata

      # PANEL 3 — coding habits: commits by hour/day, streak
      - name: Habits panel
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: yeswanths843-star
          filename: metrics.habits.svg
          template: classic
          base: ""
          plugin_habits: yes
          plugin_habits_charts_type: bar
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_from: 200
          config_timezone: Asia/Kolkata

      # PANEL 4 — languages + technologies/topics you use
      - name: Languages panel
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: yeswanths843-star
          filename: metrics.languages.svg
          template: classic
          base: ""
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_load: 300
          plugin_languages_threshold: "0%"
          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_limit: 24
          config_timezone: Asia/Kolkata

      # PANEL 5 — PageSpeed Insights for your site
      - name: PageSpeed panel
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: yeswanths843-star
          filename: metrics.pagespeed.svg
          template: classic
          base: ""
          plugin_pagespeed: yes
          plugin_pagespeed_detailed: yes
          plugin_pagespeed_screenshot: no
          plugin_pagespeed_url: https://yeswanths843-star.github.io/AZHAGIYAL-VIBEZZ/
          config_timezone: Asia/Kolkata

      # PANEL 6 — GitHub Projects board (roadmap / todos)
      - name: Projects panel
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: yeswanths843-star
          filename: metrics.projects.svg
          template: classic
          base: ""
          plugin_projects: yes
          plugin_projects_limit: 3
          config_timezone: Asia/Kolkata
